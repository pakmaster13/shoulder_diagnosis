name: shoulder_guide
description: An educational shoulder symptom reference built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/symptoms.json
    - assets/data/conditions.json
    - assets/data/matches.json
    - assets/data/references.json
    - assets/data/recovery_resources.json
    - assets/data/videos.json
    - assets/data/temporary_pain_options.json
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
